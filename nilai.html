<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGrade - Input Nilai</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); }
        .gradient-text { background: linear-gradient(to right, #2563eb, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <!-- Script Module Setup -->
    <script type="module" src="js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- jsPDF & AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { isLoggedIn, logout } from './js/auth.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); window.location.href = 'index.html'; });
            document.getElementById('logoutBtnMobile')?.addEventListener('click', () => { logout(); window.location.href = 'index.html'; });
            
        });
    </script>
</head>
<body class="text-slate-800 antialiased h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-50 to-blue-100 flex">
    <!-- Main Layout -->
    <section class="w-full h-full flex flex-col md:flex-row">
        
        <!-- Sidebar -->
        <aside class="w-64 glass border-r border-white/50 flex flex-col hidden md:flex z-20">
            <div class="h-16 flex items-center px-6 border-b border-white/50">
                <svg class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span class="ml-3 font-bold text-xl gradient-text tracking-tight">EduGrade</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="dashboard.html" class="text-gray-600 hover:bg-white/50 hover:text-gray-900 flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Dashboard
                </a>
                <a href="siswa.html" class="text-gray-600 hover:bg-white/50 hover:text-gray-900 flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    Data Siswa
                </a>
                <a href="nilai.html" class="bg-blue-50 text-blue-700 flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors">
                    <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                    Input Nilai
                </a>
                <a href="kalkulator.html" class="text-gray-600 hover:bg-white/50 hover:text-gray-900 flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    Kalkulator Rangking
                </a>
            </nav>
            <div class="p-4 border-t border-white/50">
                <button id="logoutBtn" class="w-full flex items-center justify-center px-4 py-2 border border-red-200 text-sm font-medium rounded-lg text-red-600 bg-red-50 hover:bg-red-100 transition-colors">
                    <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    Logout
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col bg-gray-50/50 relative overflow-hidden">
            <!-- Global Sync Indicator -->
            <div id="syncIndicator" class="fixed bottom-4 right-4 bg-blue-600 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 z-50 transform transition-transform translate-y-20 opacity-0">
                <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
                <span class="text-sm font-medium">Menyinkronkan data...</span>
            </div>
            
            <!-- Mobile Header -->
            <header class="md:hidden glass h-16 flex items-center justify-between px-4 z-10 border-b border-white/50">
                <span class="font-bold text-lg gradient-text">EduGrade</span>
                <div class="flex gap-3">
                    <a href="dashboard.html" class="text-gray-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg></a>
                    <a href="siswa.html" class="text-gray-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg></a>
                    <a href="nilai.html" class="text-blue-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg></a>
                    <button id="logoutBtnMobile" class="text-red-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg></button>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-8 relative">
                
                <!-- CONTENT 3: INPUT NILAI SISWA (SPREADSHEET UI) -->
                <div id="nilai-content" class="spa-content block max-w-full mx-auto">
                    <div class="mb-4">
                        <h1 class="text-3xl font-bold text-gray-900">Input Nilai Siswa</h1>
                        <p class="mt-1 text-sm text-gray-500">Pilih Mata Pelajaran lalu isikan angka langsung di dalam sel tabel. Sel berwarna kuning akan terhitung otomatis.</p>
                    </div>

                    <!-- Subject Tabs & Actions -->
                    <div class="mb-6 flex flex-col md:flex-row justify-between gap-4">
                        <div class="flex flex-wrap gap-2" id="subjectTabsContainer">
                            <!-- Tabs dihapus untuk tampilan All-in-One -->
                        </div>
                        <div class="flex flex-wrap gap-2 shrink-0">
                            <button id="btnExportPDF" class="px-4 py-2 rounded-lg text-sm font-medium border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 transition-colors shadow-sm flex items-center gap-2">
                                <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Ekspor PDF
                            </button>
                            <button id="btnDownloadTemplate1" class="px-4 py-2 rounded-lg text-sm font-medium border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-colors shadow-sm flex items-center gap-2">
                                <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Template Excel
                            </button>
                            <label class="px-4 py-2 rounded-lg text-sm font-medium border border-blue-600 bg-blue-600 text-white hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2 cursor-pointer">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                Impor Excel
                                <input type="file" id="inputImportFile" accept=".xlsx" class="hidden">
                            </label>
                        </div>
                    </div>

                    <div class="glass rounded-2xl shadow-sm border border-white p-4 relative overflow-hidden">
                        <div id="allSubjectsContainer" class="flex flex-col gap-8 w-full">
                            <!-- 9 Tabel Mata Pelajaran akan di-render di sini oleh JavaScript -->
                        </div>
                        
                        <div class="mt-4 flex justify-end items-center border-t border-gray-200 pt-4">
                            <span id="batchSaveStatus" class="mr-4 text-sm font-medium"></span>
                            <button id="batchSaveBtn" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
                                SIMPAN SELURUH NILAI
                            </button>
                        </div>
                    </div>
                </div>
                
                <footer class="mt-8 pt-4 pb-2 text-center text-sm text-gray-400 border-t border-white/20">
                    <p>&copy; 2026 EduGrade - Sistem Pengelola Nilai Ujian Sekolah Otomatisasi.</p>
                </footer>
            </main>
        </div>
    </section>
</body>
</html>
