<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGrade - Login</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); }
        .login-bg { background-image: url('https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; }
    </style>
    <!-- Script Module Setup -->
    <script type="module" src="js/auth.js"></script>
    <script type="module">
        import { isLoggedIn, login } from './js/auth.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            if (isLoggedIn()) {
                window.location.href = 'dashboard.html';
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const u = document.getElementById('username').value;
                    const p = document.getElementById('password').value;
                    const msg = document.getElementById('loginMessage');
                    
                    const btn = document.getElementById('loginBtn');
                    btn.disabled = true;
                    btn.innerHTML = 'Memverifikasi...';
                    
                    setTimeout(async () => {
                        const success = await login(u, p);
                        if (success) {
                            window.location.href = 'dashboard.html';
                        } else {
                            msg.innerText = 'Username atau Password salah!';
                            msg.classList.remove('hidden');
                            btn.disabled = false;
                            btn.innerHTML = 'Masuk ke Dashboard';
                        }
                    }, 800);
                });
            }
        });
    </script>
</head>
<body class="text-slate-800 antialiased h-screen w-screen overflow-hidden flex">
    <section id="login-view" class="w-full h-full relative login-bg">
        <div class="absolute inset-0 bg-blue-900/40 backdrop-blur-sm"></div>
        <div class="w-full h-full flex items-center justify-center relative z-10 p-4">
            <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4 shadow-inner">
                        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 tracking-tight">EduGrade</h1>
                    <p class="text-sm text-gray-500 mt-2">Sistem Pengelola Nilai Ujian Sekolah</p>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            </div>
                            <input type="text" id="username" required class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white/50 outline-none transition-all placeholder-gray-400" placeholder="Masukkan username">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </div>
                            <input type="password" id="password" autocomplete="current-password" required class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white/50 outline-none transition-all placeholder-gray-400" placeholder="Masukkan password">
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all transform hover:-translate-y-0.5">
                        Masuk ke Dashboard
                    </button>
                    
                    <div id="loginMessage" class="hidden text-center text-sm font-medium text-red-600 mt-4 bg-red-50 py-2 rounded-lg border border-red-100"></div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
